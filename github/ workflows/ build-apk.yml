name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zaher_translate
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Debug - show files
        run: |
          pwd
          ls -la

      - name: Generate Android project files
        run: |
          flutter create --org com.zaher --project-name zaher_translate --platforms=android .

      - name: Fix AndroidManifest permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <application|' "$MANIFEST"
          sed -i 's|android:label="zaher_translate"|android:label="Zaher Translate"|' "$MANIFEST"

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick fonts-dejavu

      - name: Generate app icon
        run: |
          mkdir -p assets/icon
          convert -size 1024x1024 xc:"#1565C0" \
            -fill white -gravity center \
            -font DejaVu-Sans-Bold -pointsize 620 \
            -annotate 0 "ز" \
            assets/icon/icon.png
          convert -size 1024x1024 xc:none \
            -fill white -gravity center \
            -font DejaVu-Sans-Bold -pointsize 500 \
            -annotate 0 "ز" \
            assets/icon/icon_foreground.png

      - run: flutter pub get

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: zaher-translate-apk
          path: zaher_translate/build/app/outputs/flutter-apk/app-release.apk
