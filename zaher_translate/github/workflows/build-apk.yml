1| name: Build APK
2| on:
3|   push:
4|     branches: [main]
5|   workflow_dispatch:
6| jobs:
7|   build:
8|     runs-on: ubuntu-latest
      steps:
10|       - uses: actions/checkout@v4
11| 
12|       - uses: subosito/flutter-action@v2
13|         with:
14|           channel: stable
15| 
16|       - name: Backup our custom files
17|         run: |
18|           cp pubspec.yaml /tmp/pubspec.yaml
19|           cp lib/main.dart /tmp/main.dart
20| 
21|       - name: Generate Android project files
22|         run: |
23|           flutter create --org com.zaher --project-name zaher_translate --platforms=android .
24| 
