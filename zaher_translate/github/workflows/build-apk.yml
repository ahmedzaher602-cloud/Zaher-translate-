name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Debug - list files
        run: |
          echo "=== Root folder ==="
          ls -la
          echo "=== lib folder ==="
          ls -la lib/ || echo "!! no lib folder found !!"

      - name: Scaffold Android project
        run: |
          mkdir -p /tmp/scaffold
          cd /tmp/scaffold
          flutter create --org com.zaher --project-name zaher_translate --platforms=android .
          cp -r /tmp/scaffold/android $GITHUB_WORKSPACE/
          cp /tmp/scaffold/.metadata $GITHUB_WORKSPACE/.metadata 2>/dev/null || true
          cp /tmp/scaffold/analysis_options.yaml $GITHUB_WORKSPACE/ 2>/dev/null || true

      - name: Fix AndroidManifest (permissions + app name)
        run: |
          MANIFEST=$GITHUB_WORKSPACE/android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <application|' "$MANIFEST"
          sed -i 's|android:label="zaher_translate"|android:label="Zaher Translate"|' "$MANIFEST"

      - name: Set minSdkVersion to 21
        run: |
          GRADLE=$GITHUB_WORKSPACE/android/app/build.gradle
          if [ -f "$GRADLE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' "$GRADLE" || true
            sed -i 's/minSdk flutter.minSdkVersion/minSdk 21/' "$GRADLE" || true
          fi

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick fonts-dejavu

      - name: Generate app icon
        run: |
          mkdir -p assets/icon
          convert -size 1024x1024 xc:"#1565C0" \
            -fill white -gravity center \
            -font DejaVu-Sans-Bold -pointsize 620 \
            -annotate 0 "ز" \
            assets/icon/icon.png
          convert -size 1024x1024 xc:none \
            -fill white -gravity center \
            -font DejaVu-Sans-Bold -pointsize 500 \
            -annotate 0 "ز" \
            assets/icon/icon_foreground.png

      - run: flutter pub get

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: zaher-translate-apk
          path: build/app/outputs/flutter-apk/app-release.apk
